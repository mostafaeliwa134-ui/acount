<section class="page-section purchases-page">
    <div class="page-header">
        <div>
            <h2>إدارة المشتريات</h2>
            <p>تسجيل مشتريات المتجر ومتابعة فواتير الموردين.</p>
        </div>
        <button type="button" id="new-purchase-btn" class="btn btn-primary">+ فاتورة مشتريات</button>
    </div>

    <section class="content-card">
        <h3>تسجيل فاتورة مشتريات</h3>
        <form id="purchase-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="purchase-supplier">المورد</label>
                    <select id="purchase-supplier" required>
                        <option value="">اختر المورد</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="purchase-date">تاريخ الشراء</label>
                    <input id="purchase-date" type="date" required>
                </div>
                <div class="form-group">
                    <label for="purchase-invoice">رقم الفاتورة</label>
                    <input id="purchase-invoice" type="text" required placeholder="رقم الفاتورة">
                </div>
                <div class="form-group">
                    <label for="purchase-payment-method">طريقة الدفع</label>
                    <select id="purchase-payment-method">
                        <option value="cash">نقدي</option>
                        <option value="electronic">إلكتروني</option>
                        <option value="credit">آجل</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="purchase-total">إجمالي المشتريات</label>
                    <input id="purchase-total" type="number" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="purchase-paid">المبلغ المدفوع</label>
                    <input id="purchase-paid" type="number" min="0" step="0.01" value="0" required>
                </div>
                <div class="form-group form-group-full">
                    <label for="purchase-notes">ملاحظات</label>
                    <textarea id="purchase-notes" rows="2"></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">حفظ المشتريات</button>
            </div>
        </form>
    </section>

    <section class="content-card">
        <h3>سجل المشتريات</h3>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>رقم الفاتورة</th>
                        <th>المورد</th>
                        <th>التاريخ</th>
                        <th>الإجمالي</th>
                        <th>المدفوع</th>
                        <th>المتبقي</th>
                    </tr>
                </thead>
                <tbody id="purchases-table">
                    <tr>
                        <td colspan="6">لا توجد مشتريات مسجلة.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</section>
