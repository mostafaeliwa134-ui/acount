<section class="page-section products-page">

    <div class="page-header">
        <div>
            <h2>إدارة المنتجات</h2>
            <p>إضافة المنتجات وتعديلها ومتابعة أسعارها وكمياتها.</p>
        </div>

        <button type="button" id="add-product-btn" class="btn btn-primary">
            + إضافة منتج
        </button>
    </div>

    <section class="content-card product-form-card">
        <div class="content-card-header">
            <div>
                <h3 id="product-form-title">إضافة منتج جديد</h3>
                <p>أدخل معلومات المنتج واحفظها في المتجر.</p>
            </div>
        </div>

        <form id="product-form">

            <input type="hidden" id="product-id">

            <div class="form-grid">

                <div class="form-group">
                    <label for="product-name">اسم المنتج *</label>
                    <input type="text" id="product-name" placeholder="مثال: قميص قطني" required>
                </div>

                <div class="form-group">
                    <label for="product-code">رمز المنتج</label>
                    <input type="text" id="product-code" placeholder="مثال: PRD-001">
                </div>

                <div class="form-group">
                    <label for="product-category">التصنيف *</label>
                    <select id="product-category" required>
                        <option value="">اختر التصنيف</option>
                        <option value="بضائع متنوعة">بضائع متنوعة</option>
                        <option value="مواد غذائية">مواد غذائية</option>
                        <option value="مشروبات">مشروبات</option>
                        <option value="منظفات">منظفات</option>
                        <option value="ملابس">ملابس</option>
                        <option value="إلكترونيات">إلكترونيات</option>
                        <option value="أدوات منزلية">أدوات منزلية</option>
                        <option value="قرطاسية ومكتبية">قرطاسية ومكتبية</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="product-buy-price">سعر الشراء *</label>
                    <input type="number" id="product-buy-price" min="0" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="product-sell-price">سعر البيع *</label>
                    <input type="number" id="product-sell-price" min="0" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="product-quantity">الكمية المتوفرة *</label>
                    <input type="number" id="product-quantity" min="0" step="1" placeholder="0" required>
                </div>

                <div class="form-group">
                    <label for="product-min-quantity">الحد الأدنى للمخزون</label>
                    <input type="number" id="product-min-quantity" min="0" step="1" value="5">
                </div>

                <div class="form-group form-group-full">
                    <label for="product-description">وصف المنتج</label>
                    <textarea id="product-description" rows="3" placeholder="اكتب وصفًا مختصرًا للمنتج..."></textarea>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    حفظ المنتج
                </button>

                <button type="reset" class="btn btn-secondary" id="reset-product-form">
                    تفريغ الحقول
                </button>
            </div>

        </form>
    </section>

    <section class="content-card products-list-card">

        <div class="content-card-header">
            <div>
                <h3>قائمة المنتجات</h3>
                <p>ابحث عن المنتجات وراجع بياناتها.</p>
            </div>
        </div>

        <div class="table-filters">

            <div class="form-group">
                <label for="product-search">البحث عن منتج</label>
                <input type="search" id="product-search" placeholder="ابحث بالاسم أو الرمز...">
            </div>

            <div class="form-group">
                <label for="product-category-filter">تصفية حسب التصنيف</label>
                <select id="product-category-filter">
                    <option value="">جميع التصنيفات</option>
                </select>
            </div>

        </div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>الرمز</th>
                        <th>اسم المنتج</th>
                        <th>التصنيف</th>
                        <th>سعر الشراء</th>
                        <th>سعر البيع</th>
                        <th>الكمية</th>
                        <th>الحد الأدنى</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>

                <tbody id="products-table">
                    <tr>
                        <td colspan="8">لا توجد منتجات حتى الآن.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>

</section>
